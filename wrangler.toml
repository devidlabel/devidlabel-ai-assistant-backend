name = "devidlabel-ai-assistant-backend"
main = "src/worker-v3.ts"
compatibility_date = "2026-06-25"

[vars]
ASSISTANT_MODEL = "gpt-4o-mini"
# Comma-separated list. The Worker also derives the exact *.myshopify.com preview origin from SHOPIFY_SHOP_DOMAIN.
ASSISTANT_ALLOWED_ORIGINS = "https://devidlabel.com,https://www.devidlabel.com"
SHOPIFY_API_VERSION = "2025-10"
SHOPIFY_RECOMMENDATION_CACHE_TTL_SECONDS = "3600"
COMMERCE_TENANT_ID = "devid_multibrand"
# Meta identifiers are non-secret runtime configuration. Access tokens remain Cloudflare secrets only.
META_AD_ACCOUNT_ID = "843613162004896"
META_GRAPH_API_VERSION = "v26.0"
META_PIXEL_ID = "154718499430701"
# Google Ads identifiers are non-secret. OAuth credentials/developer token remain Cloudflare secrets only.
GOOGLE_ADS_CUSTOMER_ID = "2117126418"
GOOGLE_ADS_API_VERSION = "v24"

[[kv_namespaces]]
binding = "SHOPIFY_TOKENS_KV"
id = "1677a2da44da455fa3b15977ff0099e4"
