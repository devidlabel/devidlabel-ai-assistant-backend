name: Fix Klaviyo Sneakers Segment Query

on:
  push:
    branches:
      - ops/fix-klaviyo-sneakers-new-season-segment-query
    paths:
      - 'ops/klaviyo-sneakers-new-season-fix/execute.json'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove unsupported segment list additional field
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/klaviyo-sneakers-new-season-010926.ts')
          s = p.read_text()
          old = 'q.set("additional-fields[segment]","profile_count"); '
          if old not in s:
              raise SystemExit('expected query fragment not found')
          p.write_text(s.replace(old, '', 1))
          PY
          grep -q 'async function findSegment' src/klaviyo-sneakers-new-season-010926.ts
          if grep -q 'additional-fields\[segment\]' src/klaviyo-sneakers-new-season-010926.ts; then
            echo 'unsupported parameter still present' >&2
            exit 2
          fi

      - name: Commit fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/klaviyo-sneakers-new-season-010926.ts
          git commit -m "Fix Klaviyo segment lookup for sneakers campaign"
          git push origin main
