name: TEMP Execute K-Way Klaviyo Campaigns

on:
  push:
    branches:
      - ops/execute-kway-klaviyo-2026-08-11

permissions:
  contents: read
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=devidlabel-kway-klaviyo-2026-08-11")
          token=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.value) process.exit(2); process.stdout.write(d.value)' "$response")
          echo "OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Execute campaigns after live deploy
        shell: bash
        run: |
          set -euo pipefail
          url="https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/ops/kway-klaviyo-2026-08-11"
          ok=0
          for attempt in $(seq 1 40); do
            status=$(curl --silent --show-error -o kway-klaviyo-execution.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $OIDC_TOKEN" "$url" || true)
            if [ "$status" = "200" ]; then
              operation=$(node -e "const d=require('./kway-klaviyo-execution.json');process.stdout.write(String(d.operation||''))" || true)
              if [ "$operation" = "kway_klaviyo_execute" ]; then ok=1; break; fi
            fi
            echo "execution attempt $attempt returned HTTP $status before execution route was ready"
            sleep 10
          done
          if [ "$ok" != "1" ]; then cat kway-klaviyo-execution.json || true; exit 3; fi
          node - <<'NODE'
          const d=require('./kway-klaviyo-execution.json');
          console.log(JSON.stringify(d,null,2));
          if(d.ok!==true) process.exit(4);
          if(!Array.isArray(d.results)||d.results.length!==2||d.results.some(r=>r.ok!==true)) process.exit(5);
          NODE

      - name: Verify Klaviyo campaign states
        shell: bash
        run: |
          set -euo pipefail
          url="https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/ops/kway-klaviyo-2026-08-11"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC_TOKEN" "$url" -o kway-klaviyo-status.json
          node - <<'NODE'
          const d=require('./kway-klaviyo-status.json');
          console.log(JSON.stringify(d,null,2));
          if(d.ok!==true || !Array.isArray(d.campaigns) || d.campaigns.length!==2) process.exit(6);
          if(d.campaigns.some(c=>!['Scheduled','Sent'].includes(c.status))) process.exit(7);
          NODE

      - name: Upload private execution artifact
        uses: actions/upload-artifact@v4
        with:
          name: kway-klaviyo-execution-${{ github.run_id }}
          path: |
            kway-klaviyo-execution.json
            kway-klaviyo-status.json
          retention-days: 7
          if-no-files-found: error
