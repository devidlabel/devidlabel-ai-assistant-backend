name: TEMP Inspect K-Way Klaviyo Campaigns

on:
  push:
    branches:
      - ops/execute-kway-klaviyo-2026-08-11

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=devidlabel-kway-klaviyo-2026-08-11")
          token=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.value) process.exit(2); process.stdout.write(d.value)' "$response")
          echo "OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Inspect campaign states
        shell: bash
        run: |
          set -euo pipefail
          url="https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/ops/kway-klaviyo-execute3-2026-08-11"
          curl --max-time 30 --fail --silent --show-error -H "Authorization: Bearer $OIDC_TOKEN" "$url" -o kway-klaviyo-status.json
          cat kway-klaviyo-status.json
          node - <<'NODE'
          const d=require('./kway-klaviyo-status.json');
          if(d.ok!==true || !Array.isArray(d.campaigns)) process.exit(3);
          NODE

      - name: Upload private status artifact
        uses: actions/upload-artifact@v4
        with:
          name: kway-klaviyo-status-${{ github.run_id }}
          path: kway-klaviyo-status.json
          retention-days: 7
          if-no-files-found: error
