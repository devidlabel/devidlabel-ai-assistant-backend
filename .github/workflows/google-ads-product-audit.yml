name: Google Ads Product Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ops/google-ads-product-audit/request.json

permissions:
  contents: write

env:
  WORKER_URL: https://devidlabel-ai-assistant-backend.devidlabel.workers.dev

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch SKU-level Google Ads product performance
        env:
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
        shell: bash
        run: |
          test -n "$DAILY_PULSE_ACCESS_TOKEN"
          test -f ops/google-ads-product-audit/request.json
          START="$(node -p "JSON.parse(require('fs').readFileSync('ops/google-ads-product-audit/request.json','utf8')).start")"
          END="$(node -p "JSON.parse(require('fs').readFileSync('ops/google-ads-product-audit/request.json','utf8')).end")"
          test -n "$START"
          test -n "$END"
          URL="$WORKER_URL/internal/google-ads/products?start=$START&end=$END"
          for ATTEMPT in $(seq 1 15); do
            echo "Google Ads product audit attempt $ATTEMPT/15"
            STATUS="$(curl --silent --show-error -o google-ads-product-audit.json -w '%{http_code}' -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" "$URL" || true)"
            OK="$(node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync("google-ads-product-audit.json","utf8"));process.stdout.write(x.ok===true?"true":"false")}catch{process.stdout.write("false")}' || true)"
            if [ "$STATUS" = "200" ] && [ "$OK" = "true" ]; then
              break
            fi
            echo "status=$STATUS body=$(head -c 600 google-ads-product-audit.json || true)"
            if [ "$ATTEMPT" -eq 15 ]; then
              exit 1
            fi
            sleep 10
          done
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('google-ads-product-audit.json','utf8'));
          if(data.ok!==true) process.exit(1);
          console.log(JSON.stringify({range:data.range,summary:data.summary,top_burners:(data.burners||[]).slice(0,20).map(x=>({sku:x.sku,spend:x.spend,title:x.product_title,conversions:x.conversions}))},null,2));
          NODE

      - name: Upload private audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-product-audit-${{ github.run_id }}
          path: google-ads-product-audit.json
          retention-days: 45
          if-no-files-found: error

      - name: Publish latest pointer
        shell: bash
        run: |
          mkdir -p ops/google-ads-product-audit
          GENERATED_AT="$(node -p "JSON.parse(require('fs').readFileSync('google-ads-product-audit.json','utf8')).generated_at")"
          START="$(node -p "JSON.parse(require('fs').readFileSync('google-ads-product-audit.json','utf8')).range.start")"
          END="$(node -p "JSON.parse(require('fs').readFileSync('google-ads-product-audit.json','utf8')).range.end")"
          cat > ops/google-ads-product-audit/latest.json <<EOF
          {
            "run_id": ${{ github.run_id }},
            "artifact_name": "google-ads-product-audit-${{ github.run_id }}",
            "generated_at": "$GENERATED_AT",
            "start": "$START",
            "end": "$END",
            "timezone": "Europe/Rome"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/google-ads-product-audit/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Google Ads product audit pointer"
          git pull --rebase origin main
          git push origin HEAD:main
