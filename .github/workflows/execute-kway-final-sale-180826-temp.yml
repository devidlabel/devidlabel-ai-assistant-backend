name: TEMP Diagnose K-Way Final Sale 18 Aug 2026

on:
  push:
    branches:
      - ops/execute-kway-final-sale-2026-08-18

permissions:
  contents: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/execute-kway-final-sale-2026-08-18

      - name: Fetch GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=devidlabel-kway-final-sale-2026-08-18")
          token=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.value) process.exit(2); process.stdout.write(d.value)' "$response")
          echo "OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Read live preflight and status
        shell: bash
        run: |
          set -euo pipefail
          base="https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/ops/kway-final-sale-2026-08-18"
          curl --max-time 120 --fail --silent --show-error -H "Authorization: Bearer $OIDC_TOKEN" "$base" -o /tmp/preflight.json
          curl --max-time 120 --fail --silent --show-error -H "Authorization: Bearer $OIDC_TOKEN" "$base?mode=status" -o /tmp/status.json
          node - <<'NODE'
          const fs=require('fs');
          const body={captured_at:new Date().toISOString(),preflight:JSON.parse(fs.readFileSync('/tmp/preflight.json')),status:JSON.parse(fs.readFileSync('/tmp/status.json'))};
          fs.writeFileSync('ops/kway-final-sale-180826-diagnostic.json',JSON.stringify(body,null,2)+'\n');
          NODE

      - name: Persist diagnostic readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MARE Operations"
          git config user.email "operations@devidlabel.com"
          git add ops/kway-final-sale-180826-diagnostic.json
          git commit -m "Persist K-Way Final Sale diagnostic [skip ci]"
          git push origin HEAD:ops/execute-kway-final-sale-2026-08-18
