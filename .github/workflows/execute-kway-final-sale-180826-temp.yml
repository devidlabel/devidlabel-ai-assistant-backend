name: TEMP Read Back K-Way Final Sale 18 Aug 2026

on:
  push:
    branches:
      - ops/execute-kway-final-sale-2026-08-18

permissions:
  contents: write
  id-token: write

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/execute-kway-final-sale-2026-08-18

      - name: Fetch GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=devidlabel-kway-final-sale-2026-08-18")
          token=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.value) process.exit(2); process.stdout.write(d.value)' "$response")
          echo "OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Poll final Klaviyo readback
        shell: bash
        run: |
          set -euo pipefail
          url="https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/ops/kway-final-sale-2026-08-18?mode=status"
          for attempt in $(seq 1 72); do
            curl --max-time 60 --fail --silent --show-error \
              -H "Authorization: Bearer $OIDC_TOKEN" "$url" \
              -o ops/kway-final-sale-180826-final-readback.json
            engaged=$(node -e "const d=require('./ops/kway-final-sale-180826-final-readback.json');process.stdout.write(String(d.campaigns?.engaged90?.status||''))")
            historical=$(node -e "const d=require('./ops/kway-final-sale-180826-final-readback.json');process.stdout.write(String(d.campaigns?.historical_kway?.status||''))")
            if { [ "$engaged" = "Scheduled" ] || [ "$engaged" = "Sent" ]; } && \
               { [ "$historical" = "Scheduled" ] || [ "$historical" = "Sent" ]; }; then
              exit 0
            fi
            sleep 5
          done
          exit 7

      - name: Persist exact API readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MARE Operations"
          git config user.email "operations@devidlabel.com"
          git add ops/kway-final-sale-180826-final-readback.json
          git commit -m "Persist K-Way Final Sale readback [skip ci]"
          git push origin HEAD:ops/execute-kway-final-sale-2026-08-18
