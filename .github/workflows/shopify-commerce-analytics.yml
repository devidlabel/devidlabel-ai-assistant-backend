name: Shopify Commerce Analytics Snapshot

on:
  workflow_dispatch:
  schedule:
    # Target 07:05 Europe/Rome before the 08:00 ChatGPT business report.
    # Two UTC slots cover CET/CEST; the freshness guard below makes the job
    # idempotent and also provides a recovery slot when GitHub starts late.
    - cron: '5 5 * * *'
    - cron: '5 6 * * *'

concurrency:
  group: shopify-commerce-analytics-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  WORKER_URL: https://devidlabel-ai-assistant-backend.devidlabel.workers.dev

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check Europe/Rome pre-report window and freshness
        id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR="$(TZ=Europe/Rome date +%H)"
          TODAY="$(TZ=Europe/Rome date +%F)"
          LATEST_DATE="$(node - <<'NODE'
          const fs = require('node:fs');
          try {
            const data = JSON.parse(fs.readFileSync('ops/shopify-commerce-analytics/latest.json', 'utf8'));
            if (!data.generated_at) process.exit(0);
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date(data.generated_at));
            const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
            process.stdout.write(`${values.year}-${values.month}-${values.day}`);
          } catch {}
          NODE
          )"

          if [ "$LATEST_DATE" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=already_fresh_today" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -le 8 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=scheduled_pre_report_window" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=outside_pre_report_window" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Shopify commerce analytics bundle
        if: steps.window.outputs.run == 'true'
        env:
          SHOPIFY_REPORT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_REPORT_ACCESS_TOKEN }}
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
        shell: bash
        run: |
          test -n "$SHOPIFY_REPORT_ACCESS_TOKEN$DAILY_PULSE_ACCESS_TOKEN"

          for ATTEMPT in 1 2 3; do
            echo "Shopify analytics build attempt $ATTEMPT/3"
            node scripts/build-shopify-commerce-analytics.mjs

            PRIMARY_OK="$(node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync("shopify-commerce-analytics.json","utf8")); const required=new Set(["yesterday","last_3_days","last_7_days"]); const windows=Array.isArray(data.windows)?data.windows:[]; const selected=windows.filter(window=>required.has(window.key)); const ok=selected.length===required.size&&selected.every(window=>window?.source_status?.orders?.ok===true&&window?.source_status?.analytics?.ok===true); process.stdout.write(ok?"true":"false");')"
            COMPLETE="$(node -p "JSON.parse(require('fs').readFileSync('shopify-commerce-analytics.json','utf8')).ok === true")"

            if [ "$COMPLETE" = "true" ]; then
              echo "All Shopify analytics windows are complete."
              break
            fi

            if [ "$PRIMARY_OK" = "true" ]; then
              echo "Primary 1/3/7-day windows are valid; long-window analytics are partial."
            else
              echo "Primary Shopify analytics windows are incomplete."
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              SLEEP_SECONDS=$((ATTEMPT * 20))
              echo "Retrying after ${SLEEP_SECONDS}s to clear transient/rate-limit errors."
              sleep "$SLEEP_SECONDS"
            fi
          done

          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('shopify-commerce-analytics.json', 'utf8'));
          const required = new Set(['yesterday', 'last_3_days', 'last_7_days']);
          const windows = Array.isArray(data.windows) ? data.windows : [];
          const selected = windows.filter(window => required.has(window.key));
          const primaryOk = selected.length === required.size && selected.every(window =>
            window?.source_status?.orders?.ok === true && window?.source_status?.analytics?.ok === true
          );
          if (!primaryOk) {
            console.error('Shopify analytics primary 1/3/7-day windows are still incomplete after retries.');
            process.exit(1);
          }
          if (data.ok !== true) {
            console.warn('Shopify analytics is usable for the daily report, but one or more 14/30-day windows remain partial.');
          }
          NODE

      - name: Upload private Shopify analytics artifact
        if: steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shopify-commerce-analytics-${{ github.run_id }}
          path: shopify-commerce-analytics.json
          retention-days: 45
          if-no-files-found: error

      - name: Publish non-sensitive latest pointer
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p ops/shopify-commerce-analytics
          GENERATED_AT="$(node -p "JSON.parse(require('fs').readFileSync('shopify-commerce-analytics.json','utf8')).generated_at")"
          COMPLETE="$(node -p "JSON.parse(require('fs').readFileSync('shopify-commerce-analytics.json','utf8')).ok === true")"
          OK="$(node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync("shopify-commerce-analytics.json","utf8")); const required=new Set(["yesterday","last_3_days","last_7_days"]); const windows=Array.isArray(data.windows)?data.windows:[]; const selected=windows.filter(window=>required.has(window.key)); const ok=selected.length===required.size&&selected.every(window=>window?.source_status?.orders?.ok===true&&window?.source_status?.analytics?.ok===true); process.stdout.write(ok?"true":"false");')"
          cat > ops/shopify-commerce-analytics/latest.json <<EOF
          {
            "run_id": ${{ github.run_id }},
            "artifact_name": "shopify-commerce-analytics-${{ github.run_id }}",
            "generated_at": "$GENERATED_AT",
            "ok": $OK,
            "complete": $COMPLETE,
            "timezone": "Europe/Rome"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/shopify-commerce-analytics/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Shopify commerce analytics pointer"
          git pull --rebase origin main
          git push origin HEAD:main
