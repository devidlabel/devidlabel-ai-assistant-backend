name: Daily Pulse Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-pulse.yml'
      - 'src/daily-pulse.ts'
      - 'src/daily-pulse-organic.ts'
      - 'src/tiktok-reporting.ts'
      - 'src/youtube-reporting.ts'
  schedule:
    # Redundant pre-report retries. GitHub scheduled runs can be delayed,
    # so we start early and retry every 15 minutes across the CET/CEST window.
    # The freshness guard makes these runs idempotent after the first success.
    - cron: '5,20,35,50 4,5,6 * * *'

concurrency:
  group: daily-pulse-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  WORKER_URL: https://devidlabel-ai-assistant-backend.devidlabel.workers.dev

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check Europe/Rome pre-report window and freshness
        id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_or_code_change" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR="$(TZ=Europe/Rome date +%H)"
          TODAY="$(TZ=Europe/Rome date +%F)"
          LATEST_DATE="$(node - <<'NODE'
          const fs = require('node:fs');
          try {
            const data = JSON.parse(fs.readFileSync('ops/daily-pulse/latest.json', 'utf8'));
            if (!data.generated_at) process.exit(0);
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date(data.generated_at));
            const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
            process.stdout.write(`${values.year}-${values.month}-${values.day}`);
          } catch {}
          NODE
          )"

          if [ "$LATEST_DATE" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=already_fresh_today" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Do not skip a delayed GitHub schedule solely because it started late.
          # If today's valid pointer does not exist yet, every scheduled retry is
          # allowed to recover the snapshot.
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "reason=scheduled_recovery_until_fresh" >> "$GITHUB_OUTPUT"

      - name: Fetch protected Daily Pulse
        if: steps.window.outputs.run == 'true'
        shell: bash
        env:
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
        run: |
          test -n "$DAILY_PULSE_ACCESS_TOKEN"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" \
            "$WORKER_URL/internal/daily-pulse/report" \
            -o daily-pulse.json

          # Detailed external sources are fetched in separate Worker invocations.
          # This prevents Search Console / YouTube / GA4 from competing for the
          # Cloudflare per-invocation subrequest budget used by the aggregate pulse.
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" \
            "$WORKER_URL/internal/ga4/report?timeframe=yesterday" \
            -o ga4-yesterday.json
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" \
            "$WORKER_URL/internal/ga4/report?timeframe=last_7_days" \
            -o ga4-last-7-days.json
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" \
            "$WORKER_URL/internal/search-console/report?timeframe=last_7_days" \
            -o search-console-last-7-days.json
          curl --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" \
            "$WORKER_URL/internal/youtube/report?days=7" \
            -o youtube-last-7-days.json
          curl --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" \
            "$WORKER_URL/internal/youtube/report?days=28" \
            -o youtube-last-28-days.json

          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('daily-pulse.json', 'utf8'));
          const ga4Yesterday = JSON.parse(fs.readFileSync('ga4-yesterday.json', 'utf8'));
          const ga4Last7Days = JSON.parse(fs.readFileSync('ga4-last-7-days.json', 'utf8'));
          const searchConsoleLast7Days = JSON.parse(fs.readFileSync('search-console-last-7-days.json', 'utf8'));
          const youtubeLast7Days = JSON.parse(fs.readFileSync('youtube-last-7-days.json', 'utf8'));
          const youtubeLast28Days = JSON.parse(fs.readFileSync('youtube-last-28-days.json', 'utf8'));

          if (data.ok !== true || ga4Yesterday.ok !== true || ga4Last7Days.ok !== true || searchConsoleLast7Days.ok !== true) {
            console.error(JSON.stringify({
              daily_pulse_ok: data.ok,
              ga4_yesterday_ok: ga4Yesterday.ok,
              ga4_last_7_days_ok: ga4Last7Days.ok,
              search_console_last_7_days_ok: searchConsoleLast7Days.ok,
              ga4_yesterday_message: ga4Yesterday.message || null,
              ga4_last_7_days_message: ga4Last7Days.message || null,
              search_console_message: searchConsoleLast7Days.message || null,
            }));
            process.exit(1);
          }

          const tableRows = (table, limit) => Array.isArray(table?.rows) ? table.rows.slice(0, limit) : [];
          const objectRows = (value, limit) => Array.isArray(value) ? value.slice(0, limit) : [];
          const compactGa4 = (source) => ({
            ok: true,
            property_id: source.property_id || null,
            timeframe: source.timeframe || null,
            overview: source.overview || {},
            daily: source.daily || {},
            landing_pages: source.landing_pages || {},
            source_medium: source.source_medium || {},
            campaigns: source.campaigns || {},
            devices: source.devices || {},
            countries: source.countries || {},
            ecommerce_funnel: source.ecommerce_funnel || {},
            reconciled_in_workflow: true,
          });
          const compactSearchConsole = (source) => ({
            ok: true,
            site_url: source.site_url || null,
            timeframe: source.timeframe || null,
            totals: source.totals || {},
            daily: tableRows(source.daily, 31),
            queries: tableRows(source.queries, 150),
            pages: tableRows(source.pages, 150),
            devices: tableRows(source.devices, 20),
            countries: tableRows(source.countries, 50),
            limitations: source.limitations || [],
            reconciled_in_workflow: true,
          });
          const youtubeSectionData = (source, name) => {
            const section = source?.sections?.[name];
            return section && section.ok === true && section.data && typeof section.data === 'object' ? section.data : {};
          };
          const compactYouTube = (source) => {
            if (source?.ok !== true) return {
              ok: false,
              status: 502,
              error: source?.error || 'youtube_unavailable',
              authorization: source?.status || {},
              reconciled_in_workflow: true,
            };
            const channel = youtubeSectionData(source, 'channel');
            const summary = youtubeSectionData(source, 'summary');
            const videos = youtubeSectionData(source, 'videos');
            const traffic = youtubeSectionData(source, 'traffic_sources');
            const search = youtubeSectionData(source, 'search_terms');
            return {
              ok: true,
              provider: 'youtube',
              read_only: source.read_only !== false,
              days: source.days || null,
              section_counts: source.section_counts || {},
              authorization: source.status || {},
              channel: channel.channel || {},
              summary: summary.summary || {},
              top_videos: objectRows(videos.videos, 25),
              traffic_sources: objectRows(traffic.traffic_sources, 30),
              search_terms: objectRows(search.search_terms, 50),
              retrieved_at: source.retrieved_at || null,
              reconciled_in_workflow: true,
            };
          };

          data.yesterday = data.yesterday || {};
          data.yesterday.sources = data.yesterday.sources || {};
          data.yesterday.source_status = data.yesterday.source_status || {};
          data.yesterday.sources.ga4 = compactGa4(ga4Yesterday);
          data.yesterday.source_status.ga4 = { ok: true, status: 200, reconciled_in_workflow: true };

          data.last_7_days = data.last_7_days || {};
          data.last_7_days.sources = data.last_7_days.sources || {};
          data.last_7_days.source_status = data.last_7_days.source_status || {};
          data.last_7_days.sources.ga4 = compactGa4(ga4Last7Days);
          data.last_7_days.source_status.ga4 = { ok: true, status: 200, reconciled_in_workflow: true };

          data.search_console = {
            last_7_days: compactSearchConsole(searchConsoleLast7Days),
            source_status: { ok: true, status: 200, reconciled_in_workflow: true },
          };

          const youtube7 = compactYouTube(youtubeLast7Days);
          const youtube28 = compactYouTube(youtubeLast28Days);
          data.youtube = {
            last_7_days: youtube7,
            last_28_days: youtube28,
            source_status: {
              last_7_days: { ok: youtube7.ok === true, status: youtube7.ok === true ? 200 : 502, reconciled_in_workflow: true },
              last_28_days: { ok: youtube28.ok === true, status: youtube28.ok === true ? 200 : 502, reconciled_in_workflow: true },
            },
          };

          data.notes = Array.isArray(data.notes) ? data.notes : [];
          data.notes.push('Detailed GA4 and Search Console are reconciled by the workflow in separate Worker invocations to preserve the Cloudflare subrequest budget.');
          data.notes.push('YouTube 7/28-day intelligence is also fetched separately; YouTube failure is reported as a source alert and does not block the commerce report.');
          fs.writeFileSync('daily-pulse.json', JSON.stringify(data, null, 2));

          console.log(JSON.stringify({
            generated_at: data.generated_at,
            yesterday_status: data.yesterday?.source_status,
            last_7_days_status: data.last_7_days?.source_status,
            search_console_status: data.search_console?.source_status,
            youtube_status: data.youtube?.source_status,
            paid_media_primary_scope_yesterday: data.yesterday?.combined?.paid_media_primary_scope,
            paid_media_primary_scope_last_7_days: data.last_7_days?.combined?.paid_media_primary_scope,
          }));
          NODE

      - name: Upload private report artifact
        if: steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-pulse-${{ github.run_id }}
          path: daily-pulse.json
          retention-days: 45
          if-no-files-found: error

      - name: Publish non-sensitive latest pointer
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p ops/daily-pulse
          GENERATED_AT="$(node -p "JSON.parse(require('fs').readFileSync('daily-pulse.json','utf8')).generated_at")"
          cat > ops/daily-pulse/latest.json <<EOF
          {
            "run_id": ${{ github.run_id }},
            "artifact_name": "daily-pulse-${{ github.run_id }}",
            "generated_at": "$GENERATED_AT",
            "timezone": "Europe/Rome"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/daily-pulse/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Daily Pulse pointer"
          git pull --rebase origin main
          git push origin HEAD:main
