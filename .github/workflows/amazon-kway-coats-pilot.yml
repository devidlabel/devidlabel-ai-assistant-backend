name: Amazon EU K-Way COAT category EAN matching pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amazon-kway-coats-pilot.yml'

permissions:
  contents: write

concurrency:
  group: amazon-kway-coats-catalog-pilot
  cancel-in-progress: false

jobs:
  KWay-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check authenticated Amazon multi-EAN endpoint readiness
        env:
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in 1 2 3 4 5 6 7 8; do
            status=$(curl --silent --show-error --max-time 25 -o /tmp/amazon-coats-ready.json -w '%{http_code}' \
              -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" \
              'https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/amazon/catalog-eans?marketplace=IT&eans=INVALID') || status=000
            if [ "$status" = "400" ] && node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/amazon-coats-ready.json','utf8'));process.exit(j.error==='invalid_eans'?0:1)}catch{process.exit(1)}"; then
              ready=1
              break
            fi
            sleep 15
          done
          test "$ready" -eq 1
      - name: Audit K-Way jackets across Amazon IT DE FR ES (read only)
        env:
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
          AMAZON_KWAY_COATS_PILOT_RUN: 'true'
        run: |
          set -euo pipefail
          test -n "$DAILY_PULSE_ACCESS_TOKEN"
          node scripts/amazon-kway-coats-pilot.mjs
      - name: Record only sanitized K-Way coat counts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          saved=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B amazon-kway-coats-write origin/main
            mkdir -p ops/amazon
            cp /tmp/amazon-kway-coats-pilot.json ops/amazon/kway-coats-ean-pilot.json
            git add ops/amazon/kway-coats-ean-pilot.json
            if git diff --cached --quiet; then saved=1; break; fi
            git commit -m 'Record read-only Amazon EU K-Way coats EAN matching pilot'
            if git push origin HEAD:main; then saved=1; break; fi
            sleep 3
          done
          test "$saved" -eq 1
      - name: Confirm safe four-market category pilot
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('ops/amazon/kway-coats-ean-pilot.json'));if(!x.read_only || !x.no_listing_writes || !x.sample_only || !x.overall_complete)process.exit(1)"
