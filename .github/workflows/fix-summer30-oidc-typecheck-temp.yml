name: TEMP Fix SUMMER30 OIDC Typecheck

on:
  push:
    branches:
      - ops/summer30-github-oidc-2026-08-08

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/summer30-github-oidc-2026-08-08
      - name: Patch WebCrypto BufferSource typing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/shopify-summer30-once.ts')
          s=p.read_text()
          old='''    const signed = new TextEncoder().encode(`${parts[0]}.${parts[1]}`);\n    const signature = base64UrlBytes(parts[2]);\n    return crypto.subtle.verify({ name: "RSASSA-PKCS1-v1_5" }, key, signature, signed);'''
          new='''    const signed = new TextEncoder().encode(`${parts[0]}.${parts[1]}`);\n    const signature = base64UrlBytes(parts[2]);\n    const signedBuffer: ArrayBuffer = Uint8Array.from(signed).buffer;\n    const signatureBuffer: ArrayBuffer = Uint8Array.from(signature).buffer;\n    return crypto.subtle.verify({ name: "RSASSA-PKCS1-v1_5" }, key, signatureBuffer, signedBuffer);'''
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Typecheck
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name devidlabel
          git config user.email devidlabelshop@gmail.com
          git add src/shopify-summer30-once.ts
          git rm .github/workflows/fix-summer30-oidc-typecheck-temp.yml
          git commit -m 'fix: normalize OIDC signature buffers for WebCrypto'
          git push origin HEAD:ops/summer30-github-oidc-2026-08-08
