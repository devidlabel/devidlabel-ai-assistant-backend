name: MARE Business Klaviyo Capability CI

on:
  push:
    branches:
      - mare/business-os-capability-completion
    paths:
      - '.github/workflows/mare-business-klaviyo-capability-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire aggregate Klaviyo capabilities into unified Business OS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]}')
              s=s.replace(old,new,1)
              p.write_text(s)

          # Request key must not contain "profile" because the final MCP request-safety guard rejects PII-like keys.
          p=Path('src/mare-business-klaviyo-crm.ts')
          s=p.read_text().replace('request.max_profiles','request.max_records')
          s=s.replace('max_profiles: maxProfiles','max_records: maxProfiles')
          s=s.replace('reached max_profiles before the Klaviyo collection ended; increase max_profiles','reached max_records before the Klaviyo collection ended; increase max_records')
          p.write_text(s)

          cap='src/mare-business-capabilities.ts'
          replace_once(cap,
            '  const klaviyoWrite = configured(env.KLAVIYO_OPERATIONS_API_KEY);',
            '  const klaviyoRead = configured(env.KLAVIYO_PRIVATE_API_KEY);\n  const klaviyoWrite = configured(env.KLAVIYO_OPERATIONS_API_KEY);')
          replace_once(cap,
            '    capability({ id: "klaviyo.report", provider: "klaviyo", domain: "crm", operation: "read", risk: "read_only", implemented: true, configured: commerce, approval: "none", description: "Klaviyo campaign and flow reporting.", request_schema: schema({ timeframe: { type: "string" } }), requirements: [[commerce, "MARE_MCP_ACCESS_TOKEN"]] }),',
            '    capability({ id: "klaviyo.report", provider: "klaviyo", domain: "crm", operation: "read", risk: "read_only", implemented: true, configured: commerce, approval: "none", description: "Klaviyo campaign and flow reporting.", request_schema: schema({ timeframe: { type: "string" } }), requirements: [[commerce, "MARE_MCP_ACCESS_TOKEN"]] }),\n    capability({ id: "klaviyo.crm.audiences.read", provider: "klaviyo", domain: "crm", operation: "read", risk: "read_only", implemented: true, configured: businessAuth && klaviyoRead, approval: "none", description: "Read aggregate Klaviyo list and segment metadata, with optional profile counts, without returning individual profile contact data.", request_schema: schema({ query: { type: "string" }, inline_limit: { type: "integer", minimum: 1, maximum: 100 }, profile_count_limit: { type: "integer", minimum: 0, maximum: 10 } }), requirements: [[businessAuth, "MARE_BUSINESS_ACCESS_TOKEN"], [klaviyoRead, "KLAVIYO_PRIVATE_API_KEY"]] }),\n    capability({ id: "klaviyo.crm.profiles.aggregate", provider: "klaviyo", domain: "crm", operation: "read", risk: "read_only", implemented: true, configured: businessAuth && klaviyoRead, approval: "none", description: "Aggregate Klaviyo account profile and email-consent totals without returning profile identifiers or contact data.", request_schema: schema({ max_records: { type: "integer", minimum: 100, maximum: 100000 } }), requirements: [[businessAuth, "MARE_BUSINESS_ACCESS_TOKEN"], [klaviyoRead, "KLAVIYO_PRIVATE_API_KEY"]] }),')

          mcp='src/mare-business-mcp.ts'
          replace_once(mcp,
            'import { generateMarketplaceFeed, generateMatrixifyCatalog } from "./mare-business-marketplace.js";',
            'import { generateMarketplaceFeed, generateMatrixifyCatalog } from "./mare-business-marketplace.js";\nimport { readKlaviyoAudienceOverview, readKlaviyoProfileAggregate } from "./mare-business-klaviyo-crm.js";')
          replace_once(mcp,
            '  if (capabilityId === "tiktok.campaign.read") return textToolResult(await readTikTokCampaigns(request, env));\n\n  const commerceMap:',
            '  if (capabilityId === "tiktok.campaign.read") return textToolResult(await readTikTokCampaigns(request, env));\n  if (capabilityId === "klaviyo.crm.audiences.read") return textToolResult(await readKlaviyoAudienceOverview(request, env));\n  if (capabilityId === "klaviyo.crm.profiles.aggregate") return textToolResult(await readKlaviyoProfileAggregate(request, env));\n\n  const commerceMap:')

          test='scripts/test-mare-business-mcp.mjs'
          replace_once(test,
            'const tiktokSource = readFileSync("src/mare-business-tiktok.ts", "utf8");',
            'const tiktokSource = readFileSync("src/mare-business-tiktok.ts", "utf8");\nconst klaviyoCrmSource = readFileSync("src/mare-business-klaviyo-crm.ts", "utf8");')
          replace_once(test,
            '  "google_merchant.products.sync", "amazon.listings.sync", "ai.claude.review", "ai.gemini.review",',
            '  "google_merchant.products.sync", "amazon.listings.sync", "ai.claude.review", "ai.gemini.review",\n  "klaviyo.crm.audiences.read", "klaviyo.crm.profiles.aggregate",')
          anchor='for (const fragment of [\n  "inventoryLevels(first: 20)"'
          addition='for (const fragment of [\n  "aggregate_and_group_metadata_only_no_profile_pii", "aggregate_only_no_profile_identifiers_or_contact_data_returned",\n  "can_receive_email_marketing", "consent_status", "profile_count_limit", "max_records",\n]) assert.ok(klaviyoCrmSource.includes(fragment), `Missing aggregate Klaviyo CRM safeguard or field: ${fragment}`);\nassert.equal(klaviyoCrmSource.includes("request.max_profiles"), false, "Klaviyo aggregate request keys must not trip the final PII-key guard");\n\n'
          p=Path(test); s=p.read_text()
          if 'aggregate Klaviyo CRM safeguard' not in s:
              if anchor not in s: raise SystemExit('test insertion anchor not found')
              s=s.replace(anchor,addition+anchor,1); p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Business OS contract
        run: npm run test:mare-business-mcp
      - name: Commit wired capability implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mare-business-klaviyo-crm.ts src/mare-business-capabilities.ts src/mare-business-mcp.ts scripts/test-mare-business-mcp.mjs
          git commit -m 'feat: expose aggregate Klaviyo CRM capabilities in Business OS' || true
          git push origin HEAD:mare/business-os-capability-completion
