name: YouTube read-only diagnosis

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Cloudflare Worker']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/youtube-readiness.yml'
      - 'integrations/marketplace/*youtube-readiness.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-readiness.yml'
      - 'integrations/marketplace/*youtube-readiness.mjs'

permissions:
  contents: write

concurrency:
  group: youtube-readiness
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify diagnostic redaction
        run: node integrations/marketplace/test-youtube-readiness.mjs
      - name: Inspect live report without printing provider payload
        if: github.event_name != 'pull_request'
        env:
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
        run: node integrations/marketplace/youtube-readiness.mjs /tmp/youtube-readiness.json
      - name: Save sanitized diagnostic result
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/diagnostics
          cp /tmp/youtube-readiness.json ops/diagnostics/youtube-latest.json
          git add ops/diagnostics/youtube-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record safe YouTube read-only diagnosis'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
