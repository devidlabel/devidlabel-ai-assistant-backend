name: Amazon Sneakers EU batched EAN pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amazon-sneakers-batched-ean.yml'

permissions:
  contents: write

concurrency:
  group: amazon-sneakers-batched-ean
  cancel-in-progress: false

jobs:
  read-only-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify reports and batch eight new sneaker EANs per market
        env:
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
          AMAZON_SNEAKERS_BATCHED_EAN_RUN: 'true'
        run: |
          set -euo pipefail
          test -n "$DAILY_PULSE_ACCESS_TOKEN"
          node scripts/amazon-sneakers-batched-ean.mjs
      - name: Persist only aggregate categories and vendor counts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          saved=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B amazon-batched-sneakers-write origin/main
            mkdir -p ops/amazon
            cp /tmp/amazon-sneakers-batched-ean.json ops/amazon/sneakers-batched-ean-pilot.json
            git add ops/amazon/sneakers-batched-ean-pilot.json
            if git diff --cached --quiet; then saved=1; break; fi
            git commit -m 'Record sanitized Amazon sneakers batched EAN pilot'
            if git push origin HEAD:main; then saved=1; break; fi
            sleep 3
          done
          test "$saved" -eq 1
      - name: Enforce complete, read-only four-market sample
        run: |
          node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('ops/amazon/sneakers-batched-ean-pilot.json')); if (!x.overall_complete || !x.audit_complete || !x.read_only || !x.no_listing_writes) process.exit(1);"
