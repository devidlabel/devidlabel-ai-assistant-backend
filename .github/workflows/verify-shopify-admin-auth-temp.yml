name: TEMP Verify Shopify Admin Auth

on:
  push:
    branches:
      - ops/verify-shopify-write-discounts-2026-08-08

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify protected Shopify debug endpoint
        env:
          ASSISTANT_ADMIN_TOKEN: ${{ secrets.ASSISTANT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ASSISTANT_ADMIN_TOKEN:-}" ]; then
            echo '{"ok":false,"reason":"assistant_admin_token_secret_missing"}'
            exit 2
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Assistant-Admin-Token: ${ASSISTANT_ADMIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/debug/shopify \
            -o /tmp/shopify-debug.json
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/shopify-debug.json','utf8'));
          const safe={ok:d.ok,source:d.source,auth_token_source:d.auth_token_source,checks:d.checks,errors:d.errors};
          console.log(JSON.stringify(safe));
          if(d.ok!==true || d.auth_token_source!=='oauth_kv') process.exit(3);
          NODE
