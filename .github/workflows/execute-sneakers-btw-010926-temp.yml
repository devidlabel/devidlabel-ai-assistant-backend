name: TEMP Execute Sneakers BTW Sep 1 2026

on:
  push:
    branches:
      - ops/execute-sneakers-btw-2026-09-01
    paths:
      - '.github/workflows/execute-sneakers-btw-010926-temp.yml'

permissions:
  contents: write
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: ops/execute-sneakers-btw-2026-09-01

      - name: Fetch GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=devidlabel-sneakers-btw-2026-09-01")
          token=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.value) process.exit(2); process.stdout.write(d.value)' "$response")
          echo "OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          url="https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/ops/sneakers-btw-2026-09-01"
          status=$(curl --max-time 180 --silent --show-error -w '%{http_code}' \
            -H "Authorization: Bearer $OIDC_TOKEN" "$url" \
            -o sneakers-preflight.json)
          cat sneakers-preflight.json
          [ "$status" = "200" ] || exit 3
          node - <<'NODE'
          const d=require('./sneakers-preflight.json');
          if(d.ok!==true||d.mutation_performed!==false) process.exit(3);
          if((d.collections?.uomo?.unique_interest_ids||0)<5) process.exit(4);
          if((d.collections?.donna?.unique_interest_ids||0)<5) process.exit(5);
          NODE

      - name: Execute approved campaigns
        shell: bash
        run: |
          set -euo pipefail
          url="https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/ops/sneakers-btw-2026-09-01"
          status=$(curl --max-time 600 --silent --show-error -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"approval":"EXECUTE SNEAKERS BTW SEP01"}' \
            "$url" \
            -o sneakers-execution.json)
          cat sneakers-execution.json
          [ "$status" = "200" ] || exit 8
          node - <<'NODE'
          const d=require('./sneakers-execution.json');
          if(d.ok!==true||d.mutation_performed!==true) process.exit(8);
          const ds=(d.campaigns?.donna?.status||'').toLowerCase();
          const us=(d.campaigns?.uomo?.status||'').toLowerCase();
          if(!(ds==='scheduled'||ds.startsWith('queued'))) process.exit(9);
          if(!(us==='scheduled'||us.startsWith('queued'))) process.exit(10);
          if(!d.segments?.uomo_interest?.id||!d.segments?.donna_interest?.id) process.exit(11);
          NODE

      - name: Persist execution receipt
        if: always()
        shell: bash
        run: |
          mkdir -p ops/sneakers-btw-execution
          node - <<'NODE'
          const fs=require('fs');
          function read(p){try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}}
          const p=read('sneakers-preflight.json'); const e=read('sneakers-execution.json');
          const receipt={run_id:Number(process.env.GITHUB_RUN_ID),generated_at:new Date().toISOString(),preflight_ok:p?.ok===true,execution_ok:e?.ok===true&&e?.mutation_performed===true,error:e?.error||null,segments:e?.segments||null,campaigns:e?.campaigns||null,merchandising:e?.merchandising||p?.collections||null,safety:e?.safety||null};
          fs.writeFileSync('ops/sneakers-btw-execution/latest.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/sneakers-btw-execution/latest.json
          if ! git diff --cached --quiet; then git commit -m "Record Sep 1 sneakers campaign execution" && git push origin HEAD:ops/execute-sneakers-btw-2026-09-01; fi

      - name: Upload private artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sneakers-btw-010926-${{ github.run_id }}
          path: |
            sneakers-preflight.json
            sneakers-execution.json
            ops/sneakers-btw-execution/latest.json
          retention-days: 30
          if-no-files-found: warn

