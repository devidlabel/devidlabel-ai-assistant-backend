name: Klaviyo Campaign Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/klaviyo-campaign-inventory/request.json'
      - '.github/workflows/klaviyo-campaign-inventory.yml'

permissions:
  contents: write

env:
  WORKER_URL: https://devidlabel-ai-assistant-backend.devidlabel.workers.dev

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch read-only Klaviyo campaign inventory
        id: fetch_inventory
        env:
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
        shell: bash
        run: |
          test -n "$DAILY_PULSE_ACCESS_TOKEN"
          HTTP_STATUS="$(curl --silent --show-error \
            -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" \
            -o klaviyo-campaign-inventory.json \
            -w '%{http_code}' \
            "$WORKER_URL/internal/klaviyo/campaign-inventory" || true)"
          echo "http_status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          test -f klaviyo-campaign-inventory.json || echo '{"ok":false,"error":"no_response_body"}' > klaviyo-campaign-inventory.json
          node - <<'NODE'
          const fs = require('node:fs');
          let data = {};
          try { data = JSON.parse(fs.readFileSync('klaviyo-campaign-inventory.json','utf8')); } catch { data = {ok:false,error:'invalid_json'}; }
          console.log(JSON.stringify({ok:data.ok, counts:data.counts || null, error:data.error || null, status:data.status || null}, null, 2));
          NODE

      - name: Upload inventory response artifact
        uses: actions/upload-artifact@v4
        with:
          name: klaviyo-campaign-inventory-${{ github.run_id }}
          path: klaviyo-campaign-inventory.json
          retention-days: 45
          if-no-files-found: error

      - name: Publish diagnostic pointer
        shell: bash
        env:
          HTTP_STATUS: ${{ steps.fetch_inventory.outputs.http_status }}
        run: |
          mkdir -p ops/klaviyo-campaign-inventory
          node - <<'NODE'
          const fs = require('node:fs');
          let data = {};
          try { data = JSON.parse(fs.readFileSync('klaviyo-campaign-inventory.json','utf8')); } catch { data = {ok:false,error:'invalid_json'}; }
          const pointer = {
            run_id: Number(process.env.GITHUB_RUN_ID),
            artifact_name: `klaviyo-campaign-inventory-${process.env.GITHUB_RUN_ID}`,
            generated_at: data.generated_at || new Date().toISOString(),
            ok: data.ok === true,
            http_status: Number(process.env.HTTP_STATUS || 0),
            draft_count: data.counts?.drafts ?? null,
            scheduled_count: data.counts?.scheduled ?? null,
            error: data.error || null,
            provider_status: data.status || null,
            timezone: 'Europe/Rome',
          };
          fs.writeFileSync('ops/klaviyo-campaign-inventory/latest.json', JSON.stringify(pointer, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/klaviyo-campaign-inventory/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Klaviyo campaign inventory pointer"
          git pull --rebase origin main
          git push origin HEAD:main
