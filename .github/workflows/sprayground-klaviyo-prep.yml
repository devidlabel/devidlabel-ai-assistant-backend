name: Sprayground Klaviyo Prep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/sprayground-klaviyo-prep/request.json'
      - '.github/workflows/sprayground-klaviyo-prep.yml'

permissions:
  contents: write

env:
  WORKER_URL: https://devidlabel-ai-assistant-backend.devidlabel.workers.dev

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read live Shopify Sprayground catalog and Klaviyo segments
        env:
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
        shell: bash
        run: |
          test -n "$DAILY_PULSE_ACCESS_TOKEN"
          node - <<'NODE'
          const fs = require('node:fs');
          const base = process.env.WORKER_URL;
          const token = process.env.DAILY_PULSE_ACCESS_TOKEN;
          async function get(path) {
            const response = await fetch(`${base}${path}`, { headers: { Authorization: `Bearer ${token}` } });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { ok:false, error:'invalid_json', text:text.slice(0,1000) }; }
            return { http_status: response.status, body };
          }
          (async () => {
            const [catalogResult, audienceResult] = await Promise.all([
              get('/internal/shopify/sprayground-live-catalog'),
              get('/internal/klaviyo/audience-inventory?segments_only=1'),
            ]);
            const out = {
              ok: catalogResult.http_status === 200 && catalogResult.body?.ok === true,
              generated_at: new Date().toISOString(),
              catalog_http_status: catalogResult.http_status,
              audience_http_status: audienceResult.http_status,
              catalog: catalogResult.body,
              audiences: audienceResult.body,
            };
            fs.writeFileSync('sprayground-klaviyo-prep.json', JSON.stringify(out, null, 2));
            console.log(JSON.stringify({
              ok: out.ok,
              product_count: out.catalog?.product_count ?? null,
              segment_status: out.audience_http_status,
              segment_count: out.audiences?.counts?.segments ?? null,
              credential_mode: out.audiences?.credential_mode ?? null,
              audience_error: out.audiences?.error ?? null,
            }, null, 2));
            if (!out.ok) process.exit(2);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload private prep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprayground-klaviyo-prep-${{ github.run_id }}
          path: sprayground-klaviyo-prep.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish pointer
        if: always()
        shell: bash
        run: |
          mkdir -p ops/sprayground-klaviyo-prep
          node - <<'NODE'
          const fs = require('node:fs');
          let data = {};
          try { data = JSON.parse(fs.readFileSync('sprayground-klaviyo-prep.json','utf8')); } catch { data = {ok:false,error:'missing_or_invalid_artifact'}; }
          const pointer = {
            run_id: Number(process.env.GITHUB_RUN_ID),
            artifact_name: `sprayground-klaviyo-prep-${process.env.GITHUB_RUN_ID}`,
            generated_at: data.generated_at || new Date().toISOString(),
            ok: data.ok === true,
            catalog_http_status: data.catalog_http_status ?? null,
            product_count: data.catalog?.product_count ?? null,
            audience_http_status: data.audience_http_status ?? null,
            segment_count: data.audiences?.counts?.segments ?? null,
            credential_mode: data.audiences?.credential_mode ?? null,
            audience_error: data.audiences?.error ?? null,
            timezone: 'Europe/Rome',
          };
          fs.writeFileSync('ops/sprayground-klaviyo-prep/latest.json', JSON.stringify(pointer,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/sprayground-klaviyo-prep/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Sprayground Klaviyo prep pointer"
          git pull --rebase origin main
          git push origin HEAD:main
