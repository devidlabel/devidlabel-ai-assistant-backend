name: Shopify Analytics CI

on:
  pull_request:
    paths:
      - 'src/shopify-analytics-reporting.ts'
      - 'src/worker-v3.ts'
      - 'scripts/test-shopify-analytics-reporting.mjs'
      - '.github/workflows/shopify-commerce-analytics.yml'
      - '.github/workflows/shopify-analytics-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/shopify-analytics-reporting.ts'
      - 'src/worker-v3.ts'
      - 'scripts/test-shopify-analytics-reporting.mjs'
      - '.github/workflows/shopify-commerce-analytics.yml'
      - '.github/workflows/shopify-analytics-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/test-shopify-analytics-reporting.mjs
