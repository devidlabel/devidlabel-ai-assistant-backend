name: One-off Sprayground live stock snapshot

on:
  push:
    branches:
      - main
    paths:
      - 'ops/stock-requests/*.json'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch private live Sprayground stock
        env:
          SHOPIFY_REPORT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_REPORT_ACCESS_TOKEN }}
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$SHOPIFY_REPORT_ACCESS_TOKEN"
          if [ -z "$TOKEN" ]; then TOKEN="$DAILY_PULSE_ACCESS_TOKEN"; fi
          test -n "$TOKEN"

          request_path="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ops/stock-requests/.*\.json$' | head -n 1 || true)"
          test -n "$request_path"
          mkdir -p /tmp/sprayground-stock
          endpoint='https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/shopify/sprayground-live-catalog'

          mapfile -t SKUS < <(jq -r '.skus[]? // empty' "$request_path")
          if [ "${#SKUS[@]}" -eq 0 ]; then
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $TOKEN" \
              "$endpoint" \
              -o /tmp/sprayground-stock/all.json
          else
            for SKU in "${SKUS[@]}"; do
              CLEAN="${SKU#SPR_}"
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $TOKEN" \
                --get "$endpoint" \
                --data-urlencode "q=sku:SPR_${CLEAN}" \
                -o "/tmp/sprayground-stock/${CLEAN}.json"
            done
          fi

          jq -s '{
            ok: (all(.[]; .ok == true)),
            service: "sprayground_live_stock_by_sku",
            generated_at: (map(.generated_at) | max),
            queries: [.[].query // null],
            product_count: ([.[].products[]] | length),
            products: [.[].products[]]
          }' /tmp/sprayground-stock/*.json > sprayground-live-stock.json
          jq -e '.ok == true and (.products | type == "array")' sprayground-live-stock.json >/dev/null

      - name: Upload private stock artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprayground-live-stock-${{ github.run_id }}
          path: sprayground-live-stock.json
          retention-days: 1
          if-no-files-found: error
