name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test bilingual assistant
        run: npm run test:bilingual

      - name: Test conversation task router
        run: npm run test:conversation-router

      - name: Test immediate marketplace routing
        run: npm run test:marketplace-routing

      - name: Validate API contract
        run: npm run validate:contract

      - name: Test recommendations
        run: npm run test:recommendations

      - name: Test order lookup
        run: npm run test:order-lookup

      - name: Test customer-facing tracking response
        run: npm run test:order-chat-response

      - name: Test Shopify ADV reporting
        run: npm run test:shopify-reporting

      - name: Test Klaviyo reporting resilience
        run: npm run test:klaviyo-reporting

      - name: Test Meta Marketing bridge
        run: npm run test:meta-reporting

      - name: Test Google Ads reporting bridge
        run: npm run test:google-ads-reporting

      - name: Test Search Console reporting bridge
        run: npm run test:search-console-reporting

      - name: Test GA4 Data API reporting bridge
        run: npm run test:ga4-reporting

      - name: Test MARE Commerce OS MCP bridge
        run: npm run test:mare-mcp

      - name: Test MARE Operations OS MCP foundation
        run: npm run test:mare-operations-mcp

      - name: Probe current live order flow
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npm run probe:live-orders

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployed live order flow
        if: github.event_name != 'pull_request'
        run: npm run probe:live-orders

      - name: Verify Shopify historical order visibility
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 \
            https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/shopify/history-probe \
            -o /tmp/shopify-history-probe.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/shopify-history-probe.json', 'utf8'));
          console.log(JSON.stringify(data));
          if (data.ok !== true) process.exit(1);
          if (data.historical_orders_over_60_days_accessible !== true) process.exit(2);
          NODE