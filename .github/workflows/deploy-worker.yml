name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test bilingual assistant
        run: npm run test:bilingual

      - name: Test conversation task router
        run: npm run test:conversation-router

      - name: Test immediate marketplace routing
        run: npm run test:marketplace-routing

      - name: Validate API contract
        run: npm run validate:contract

      - name: Test recommendations
        run: npm run test:recommendations

      - name: Test order lookup
        run: npm run test:order-lookup

      - name: Test customer-facing tracking response
        run: npm run test:order-chat-response

      - name: Test Shopify ADV reporting
        run: npm run test:shopify-reporting

      - name: Test bounded Shopify metafield autonomy
        run: npm run test:shopify-metafields

      - name: Test Klaviyo reporting resilience
        run: npm run test:klaviyo-reporting

      - name: Test Meta Marketing bridge
        run: npm run test:meta-reporting

      - name: Test Google Ads reporting bridge
        run: npm run test:google-ads-reporting

      - name: Test Search Console reporting bridge
        run: npm run test:search-console-reporting

      - name: Test GA4 Data API reporting bridge
        run: npm run test:ga4-reporting

      - name: Test MARE Commerce OS MCP bridge
        run: npm run test:mare-mcp

      - name: Test MARE Operations OS MCP foundation
        run: npm run test:mare-operations-mcp

      - name: Test MARE Product Media OS MCP foundation
        run: npm run test:mare-product-media-mcp

      - name: Test MARE Business OS unified foundation
        run: npm run test:mare-business-mcp

      - name: Probe current live order flow
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npm run probe:live-orders

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify MARE autonomy discovery
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 \
            -H "Content-Type: application/json" \
            -H "MCP-Protocol-Version: 2025-06-18" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/mcp-business \
            -o /tmp/mare-tools.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/mare-tools.json', 'utf8'));
          const tools = Array.isArray(data?.result?.tools) ? data.result.tools : [];
          const names = new Set(tools.map(tool => tool?.name).filter(Boolean));
          const required = ['mare_autonomy_submit', 'mare_autonomy_status', 'mare_autonomy_policy'];
          const missing = required.filter(name => !names.has(name));
          const submit = tools.find(tool => tool?.name === 'mare_autonomy_submit') || {};
          const capabilityEnum = submit?.inputSchema?.properties?.capability_id?.enum || [];
          const requiredCapabilities = [
            'klaviyo.campaign.draft.create',
            'klaviyo.campaign.draft.update',
            'github.pull_request.create',
            'shopify.metafields.update_existing',
          ];
          const missingCapabilities = requiredCapabilities.filter(name => !capabilityEnum.includes(name));
          console.log(JSON.stringify({
            tool_count: tools.length,
            autonomy_tools: required.filter(name => names.has(name)),
            missing,
            autonomy_capabilities: capabilityEnum,
            missing_capabilities: missingCapabilities,
          }, null, 2));
          if (missing.length || missingCapabilities.length) process.exit(2);
          NODE

      - name: Verify deployed live order flow
        if: github.event_name != 'pull_request'
        run: npm run probe:live-orders

      - name: Verify Shopify historical order visibility
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 \
            https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/shopify/history-probe \
            -o /tmp/shopify-history-probe.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/shopify-history-probe.json', 'utf8'));
          console.log(JSON.stringify(data));
          if (data.ok !== true) process.exit(1);
          if (data.historical_orders_over_60_days_accessible !== true) process.exit(2);
          NODE

      - name: Verify YouTube read-only analytics
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DAILY_PULSE_ACCESS_TOKEN: ${{ secrets.DAILY_PULSE_ACCESS_TOKEN }}
        run: |
          test -n "$DAILY_PULSE_ACCESS_TOKEN"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 4 \
            -H "Authorization: Bearer $DAILY_PULSE_ACCESS_TOKEN" \
            "https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/youtube/report?days=28" \
            -o /tmp/youtube-report.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/youtube-report.json', 'utf8'));
          const section = (name) => data.sections?.[name];
          const summary = section('summary')?.data?.summary || {};
          const videos = section('videos')?.data?.videos || [];
          const traffic = section('traffic_sources')?.data?.traffic_sources || [];
          const searchTerms = section('search_terms')?.data?.search_terms || [];
          const channel = section('channel')?.data?.channel || {};
          console.log(JSON.stringify({
            ok: data.ok,
            authorized: data.status?.authorized,
            read_only: data.read_only,
            section_counts: data.section_counts,
            channel_title: channel.snippet?.title || null,
            channel_subscribers: channel.statistics?.subscriberCount || null,
            channel_views_total: channel.statistics?.viewCount || null,
            last_28_days: summary,
            top_videos: videos.slice(0, 5).map(v => ({ title: v.title, views: v.views, watch_minutes: v.estimatedMinutesWatched, subscribers_gained: v.subscribersGained })),
            top_traffic_sources: traffic.slice(0, 8),
            top_search_terms: searchTerms.slice(0, 15),
          }, null, 2));
          if (data.ok !== true) process.exit(1);
          if (data.status?.authorized !== true) process.exit(2);
          if ((data.section_counts?.successful || 0) < 3) process.exit(3);
          NODE
