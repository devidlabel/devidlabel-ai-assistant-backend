name: Apply Shopify channel policy

on:
  push:
    branches:
      - fix/shopify-channel-segmentation
    paths:
      - 'scripts/apply-shopify-channel-policy.mjs'
      - '.github/workflows/apply-shopify-channel-policy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/shopify-channel-segmentation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply migration
        run: node scripts/apply-shopify-channel-policy.mjs

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test Shopify channel segmentation
        run: npm run test:shopify-reporting

      - name: Test Klaviyo resilience
        run: npm run test:klaviyo-reporting

      - name: Test MCP contract
        run: npm run test:mare-mcp

      - name: Commit final changes and remove migration scaffolding
        shell: bash
        run: |
          rm -f scripts/apply-shopify-channel-policy.mjs .github/workflows/apply-shopify-channel-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Shopify ecommerce channel segmentation and reporting"
          git push origin HEAD:fix/shopify-channel-segmentation
