name: MARE Business Klaviyo Capability Smoke

on:
  push:
    branches:
      - mare/business-os-capability-completion
    paths:
      - '.github/workflows/mare-business-klaviyo-capability-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install TypeScript
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Compile aggregate CRM module
        run: npx tsc src/mare-business-klaviyo-crm.ts --target ES2022 --module ES2022 --moduleResolution bundler --lib ES2022,DOM --skipLibCheck --outDir /tmp/klaviyo-smoke
      - name: Run live read-only aggregate smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readKlaviyoAudienceOverview, readKlaviyoProfileAggregate } from '/tmp/klaviyo-smoke/mare-business-klaviyo-crm.js';
          const env = { KLAVIYO_PRIVATE_API_KEY: process.env.KLAVIYO_PRIVATE_API_KEY };
          if (!env.KLAVIYO_PRIVATE_API_KEY) throw new Error('missing KLAVIYO_PRIVATE_API_KEY');
          const audiences = await readKlaviyoAudienceOverview({ query: 'Newsletter', inline_limit: 10, profile_count_limit: 1 }, env);
          const aggregate = await readKlaviyoProfileAggregate({ max_records: 500 }, env);
          const safe = {
            audiences_ok: audiences.ok,
            list_matches: audiences.lists?.total_matching,
            segment_matches: audiences.segments?.total_matching,
            first_list_count: audiences.lists?.items?.[0]?.profile_count ?? null,
            aggregate_ok: aggregate.ok,
            scanned: aggregate.profiles?.scanned,
            complete: aggregate.profiles?.complete,
            can_receive: aggregate.email_marketing?.can_receive,
            cannot_receive: aggregate.email_marketing?.cannot_receive,
            consent_status: aggregate.email_marketing?.consent_status,
            pii_fields_returned: false,
          };
          console.log(JSON.stringify(safe));
          if (!safe.audiences_ok || !safe.aggregate_ok || safe.scanned !== 500) process.exit(2);
          NODE
