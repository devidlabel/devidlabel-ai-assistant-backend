name: Verify live order email

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-live-order-email.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployed order email flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Probe public Worker through email step
        run: npm run probe:live-orders
