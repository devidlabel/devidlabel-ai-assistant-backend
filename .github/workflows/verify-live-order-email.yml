name: Verify live order email

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-live-order-email.yml'
      - 'scripts/diagnose-live-order-email.mjs'

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployed order email flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Capture public Worker responses
        run: node scripts/diagnose-live-order-email.mjs
      - name: Upload diagnostic response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-order-email-diagnostic
          path: live-order-email-diagnostic.json
          if-no-files-found: error
      - name: Probe public Worker through email step
        run: npm run probe:live-orders
