name: Verify live order email

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-live-order-email.yml'
      - 'scripts/diagnose-live-order-email.mjs'

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployed order email flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Capture public Worker responses
        run: node scripts/diagnose-live-order-email.mjs
      - name: Run strict probe and capture output
        shell: bash
        run: |
          set +e
          npm run probe:live-orders > probe-output.txt 2>&1
          echo "$?" > probe-exit-code.txt
          exit 0
      - name: Upload diagnostic responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-order-email-diagnostic
          path: |
            live-order-email-diagnostic.json
            probe-output.txt
            probe-exit-code.txt
          if-no-files-found: error
      - name: Enforce strict probe
        shell: bash
        run: |
          cat probe-output.txt
          test "$(cat probe-exit-code.txt)" = "0"
