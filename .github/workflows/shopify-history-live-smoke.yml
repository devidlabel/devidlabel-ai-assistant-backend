name: Shopify Historical Access Live Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/shopify-history-live-smoke.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe deployed Shopify historical access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live Worker
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 \
            https://devidlabel-ai-assistant-backend.devidlabel.workers.dev/internal/shopify/history-probe \
            -o /tmp/shopify-history-probe.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/shopify-history-probe.json', 'utf8'));
          console.log(JSON.stringify(data));
          if (data.ok !== true) process.exit(1);
          NODE
