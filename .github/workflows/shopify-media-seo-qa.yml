name: Shopify media SEO branch QA

on:
  push:
    branches:
      - codex/shopify-media-metadata-2026-08-27

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck backend
        run: npm run typecheck
      - name: Validate metadata-only safety contract
        run: node scripts/test-shopify-media-seo-bridge.mjs
